---
# Claude Code グローバル設定 (CLAUDE.md / settings.json / statusLine スクリプト) と
# 全プロジェクト共通スキル (claude/skills/*) のリンク

# runcat-metrics.py は RunCat Neo の Custom Metrics 連携。上流サンプルをベースに拡張し、
# statusLine が動かないデスクトップアプリ向けに hook 経由の入口も持たせている:
# https://github.com/runcat-dev/RunCatNeo/tree/main/docs/samples/claude-code
# 呼び出し口は settings.json の statusLine / hooks、テストは
# claude/tests/runcat_metrics_test.py (python3 で直接実行)
#
# カードは 2 枚に分けて書き出す。RunCat 側には別々のソースとして登録する:
#
#   設定 → Metrics → Custom Metrics → Add Custom Metrics Source
#     ~/.claude/runcat-usage.json     レート制限 (5h / 週間 / モデル別)
#     ~/.claude/runcat-sessions.json  動いているセッションの一覧
#
# この登録だけは RunCat アプリ側の設定 (security-scoped bookmark) なので playbook では
# 面倒を見られない。代わりに、登録時にファイルが無いと選べないため、下の seed タスクで
# 空のカードを先に置いておく。カードそのものは実行時の生成物なのでリポジトリでは
# 管理しない (管理するのは書き出す側のスクリプトと、それを呼ぶ settings.json)。
- name: Define Claude global config files
  ansible.builtin.set_fact:
    claude_config_files:
      - CLAUDE.md
      - settings.json
      - runcat-metrics.py

- name: Create ~/.claude directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0700"

- name: Check existing global config files
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item }}"
  register: claude_config_stats
  loop: "{{ claude_config_files }}"

- name: Back up existing config if it is a regular file
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item.item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item.item }}.bak-{{ ansible_facts['date_time']['date'] }}"
    remote_src: true
    mode: preserve
  when: item.stat.exists and not item.stat.islnk
  loop: "{{ claude_config_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create symlinks for global config files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/claude/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item }}"
    state: link
    force: true
  loop: "{{ claude_config_files }}"

# Claude Code を一度も動かしていない環境でも RunCat へ登録できるよう、空のカードを置く。
# スクリプト側が「既にあるカードは触らない」ので、走らせ直しても中身は消えない。
- name: Seed RunCat metrics cards so they can be registered in RunCat
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.claude/runcat-metrics.py --seed"
    creates: "{{ ansible_facts['env']['HOME'] }}/.claude/runcat-sessions.json"

# 全プロジェクト共通の汎用スキル。実体は claude/skills/<name>/ に置き、
# 各スキルを ~/.claude/skills/<name> へ個別 symlink する。個別リンクなので
# ~/.claude/skills 内の他資産 (plugin init のスクラッチ等) とは混ざらない。
# claude/skills/ を走査するため、スキル追加時に本 playbook の変更は不要。
- name: Ensure ~/.claude/skills directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory
    mode: "0700"

- name: Find repo-managed global skills
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/claude/skills"
    file_type: directory
    recurse: false
  register: claude_global_skills

- name: Symlink each repo-managed skill into ~/.claude/skills
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_global_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

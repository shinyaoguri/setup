---
# Claude Code グローバル設定 (CLAUDE.md / settings.json / statusLine スクリプト) のリンク。
# スキルはこのリポでは配らない: 自作・第三者とも plugin marketplace で供給する
# (settings.json の extraKnownMarketplaces / enabledPlugins。自作は shinyaoguri/claude-plugins)

# runcat-metrics.py は RunCat Neo の Custom Metrics 連携。上流サンプルをベースに拡張し、
# statusLine が動かないデスクトップアプリ向けに hook 経由の入口も持たせている:
# https://github.com/runcat-dev/RunCatNeo/tree/main/docs/samples/claude-code
# 呼び出し口は settings.json の statusLine / hooks、テストは
# claude/tests/runcat_metrics_test.py (python3 で直接実行)
#
# カードは 2 枚に分けて書き出す。RunCat 側には別々のソースとして登録する:
#
#   設定 → Metrics → Custom Metrics → Add Custom Metrics Source
#     ~/.claude/runcat-usage.json     レート制限 (5h / 週間 / モデル別)
#     ~/.claude/runcat-sessions.json  動いているセッションの一覧
#
# この登録だけは RunCat アプリ側の設定 (security-scoped bookmark) なので playbook では
# 面倒を見られない。代わりに、登録時にファイルが無いと選べないため、下の seed タスクで
# 空のカードを先に置いておく。カードそのものは実行時の生成物なのでリポジトリでは
# 管理しない (管理するのは書き出す側のスクリプトと、それを呼ぶ settings.json)。
#
# git-safety-guard.sh は取り返しのつかない git 操作と秘密ファイルのコミットを止める
# PreToolUse フック。リポジトリの外 (clone する前・~/ 直下・git 管理外のディレクトリ) でも
# 守る必要があるので、ここに残る側である。呼び出し口は settings.json の hooks、
# テストは claude/tests/*_test.py (python3 で直接実行)
#
# worktree-path-guard.sh はここには無い。同じリポジトリの別 worktree への書き込みを
# 止めるフックで、守る場面がリポジトリの中にしか無いため mokume 側へ移した
# (mokume-metal/mokume#499・claude-plugins の ADR-0021)。他のリポジトリへは
# 必要が示されてから配る
#
# plan-record.sh は着手時のプランを GitHub (PR / Issue のコメント) 側に残すためのフック。
# プランは ~/.claude/plans/ にも溜まるが、そこはローカルのマシンにしか無く、ランダムな
# 3 語のファイル名でリポジトリとも紐づかない。PostToolUse (ExitPlanMode) で持ち出せる形に
# 整えて .git/claude-plan-records/ へ置き (コミットされない)、Stop で未投稿を差し戻す。
# 投稿は Claude に `gh ... comment` を打たせる — 公開の前に承認を一度通すため。
# 呼び出し口は settings.json の hooks、テストは claude/tests/plan_record_test.py
#
# gh-comment-guard.sh は Issue / PR コメントに Claude の署名が付いているかを見る
# PreToolUse フック。同じ場所に人間と複数のエージェントが書き込むので、発言の出どころが
# 後から辿れる必要がある (Codex は GitHub App 経由なので GitHub 側が「commented with 〜」を
# 描くが、ローカルの gh CLI から投稿する Claude Code にその表示は出ない)。署名を付けるのは
# 規約 (claude/CLAUDE.md) の仕事で、ここは付け忘れを差し戻すだけ — PreToolUse はツール入力を
# 書き換えられないため。テストは claude/tests/gh_comment_guard_test.py
#
# term-guard.sh は世代交代したリポジトリの公開面 (push されるコミット・gh の投稿本文) に
# 旧世界の語が出ていくのを止める PreToolUse フック。「どのリポで・どの語を禁じるか」という
# ルール自体が新旧の対応関係を明かす機微情報なので、機構 (このリポ・汎用) とルール
# (ローカル管理外の ~/.claude/term-guard.d/*.rules。正本は各プロジェクトの private リポ) を
# 分離する。ルールが 1 件も無いマシンでは無音。呼び出し口は settings.json の hooks、
# テストは claude/tests/term_guard_test.py (issue #121)
#
# wait-deadline-guard.sh は外の状態を待つポーリングループ (while / until + sleep) に
# 期限が付いているかを見る PreToolUse フック。フォアグラウンドの Bash は harness が
# 上限で殺すが、run_in_background には上限が無く、停止条件が永久に真にならないと
# セッションが終わるまで残る (issue #136 で 1 時間 7 分)。待ち先が返す値は待つ側の
# 管轄外なので停止条件の書き方では塞げず、見るのは「越えたら殺す期限があるか」だけ。
# 認める形は timeout(1) と $SECONDS の 2 つ。テストは
# claude/tests/wait_deadline_guard_test.py
#
# repo-standards.json はここでは配らない。正本は claude-plugins の
# plugins/repo-standards/ に同梱されている (claude-plugins の ADR-0022)。
- name: Define Claude global config files
  ansible.builtin.set_fact:
    claude_config_files:
      - CLAUDE.md
      - settings.json
      - runcat-metrics.py
      - git-safety-guard.sh
      - provisioning-preflight.sh
      - automode-guard.py
      - plan-record.sh
      - gh-comment-guard.sh
      - term-guard.sh
      - wait-deadline-guard.sh
      - signal-guard.py

- name: Create ~/.claude directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0700"

- name: Check existing global config files
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item }}"
  register: claude_config_stats
  loop: "{{ claude_config_files }}"

- name: Back up existing config if it is a regular file
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item.item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item.item }}.bak-{{ ansible_facts['date_time']['date'] }}"
    remote_src: true
    mode: preserve
  when: item.stat.exists and not item.stat.islnk
  loop: "{{ claude_config_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create symlinks for global config files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/claude/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item }}"
    state: link
    force: true
  loop: "{{ claude_config_files }}"

# Claude Code を一度も動かしていない環境でも RunCat へ登録できるよう、空のカードを置く。
# スクリプト側が「既にあるカードは触らない」ので、走らせ直しても中身は消えない。
- name: Seed RunCat metrics cards so they can be registered in RunCat
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.claude/runcat-metrics.py --seed"
    creates: "{{ ansible_facts['env']['HOME'] }}/.claude/runcat-sessions.json"

# Gyazo MCP サーバー (macOS 版) を Claude Code の user スコープへ登録する。
# スクリーンショットを Gyazo にアップロードして URL を得るために使う
# (Issue や PR に画像を貼るときにリポジトリへ画像をコミットせずに済む)。
# バイナリは cask の gyazo が入れる。要 Gyazo v9.9.0 以降。
# 参照: https://help-ja.gyazo.com/ の「Gyazo MCP サーバー（開発者向けプレビュー版）」
- name: Check whether the Gyazo cask is installed
  ansible.builtin.command: brew list --cask gyazo
  register: gyazo_cask_installed
  failed_when: false
  changed_when: false

- name: Check Gyazo MCP server binary
  ansible.builtin.stat:
    path: "{{ gyazo_mcp_server_path }}"
  register: gyazo_mcp_bin
  vars:
    gyazo_mcp_server_path: /Applications/Gyazo Menu.app/Contents/Helpers/cli-tool/GyazoMacMCPServer

# gyazo cask は artifact が installer: manual なので、brew は .pkg を Caskroom に
# 置くだけでアプリを入れない。それでも `brew list --cask gyazo` は成功を返すので、
# セットアップは「導入済み」と報告する。ここで黙ってスキップすると、新しいマシンでは
# Gyazo MCP が無音で未登録になり、gyazo-capture スキルが使えない理由が分からない
# (issue #177)。cask は入っているのにバイナリが無い = .pkg を開いていない状態なので、
# そこだけ気付けるように知らせる。
- name: Warn when the Gyazo cask is installed but its app is not
  ansible.builtin.debug:
    msg: >-
      Gyazo の MCP サーバが見つかりません。gyazo cask は手動インストーラなので、
      /opt/homebrew/Caskroom/gyazo/ の .pkg を開いてインストールしてください
      (README の「新しいマシンで」を参照)。済ませてから
      ansible-playbook playbook_sillicon_mac.yml --tags claude を流し直すと登録されます。
  when:
    - not gyazo_mcp_bin.stat.exists
    - gyazo_cask_installed.rc == 0

# claude mcp add は登録済みだと rc=1 で終わり "already exists" を stderr に出す。
# 2 回目以降を失敗にしないよう failed_when で除外する (これが冪等性の要)
- name: Register Gyazo MCP server for Claude Code
  ansible.builtin.command:
    cmd: >-
      claude mcp add gyazo-mac
      "/Applications/Gyazo Menu.app/Contents/Helpers/cli-tool/GyazoMacMCPServer"
      -s user
  register: gyazo_mcp_add
  changed_when: "'Added stdio MCP server' in gyazo_mcp_add.stdout"
  failed_when: >-
    gyazo_mcp_add.rc != 0
    and 'already exists' not in (gyazo_mcp_add.stderr | default(''))
  when: gyazo_mcp_bin.stat.exists

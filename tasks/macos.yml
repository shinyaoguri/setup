---
# macOS のシステム設定 (osx_defaults モジュールで冪等に管理)
#
# **`defaults write` は保存値を書くだけで、動いているプロセスには届かない。**
# 反映のされ方は設定ごとに違う (issue #176):
#
#   com.apple.dock autohide      Dock を入れ直せば効く (下で条件付きに打っている)
#   KeyRepeat / InitialKeyRepeat 再ログインが要る。プロセスを殺しても効かない
#   トラックパッドの 3 キー       同上
#   Kotoeri の句読点             入力メソッドの再起動。打鍵中に殺すのは破壊的なのでやらない
#   修飾キーの入れ替え           再ログインが要る (ファイル末尾。issue #276)
#
# 実測できたのは Dock だけ (生の状態を問い合わせる口があるのがこれだけのため)。
# 残りは「効いていないように見えても再ログインで効く」と案内する側に寄せている
# — 確かめられていない機構を根拠にプロセスを殺さない。

# osx_defaults は strict な型チェックをするので、過去にシェルから別の型で
# 書き込まれた残骸があると Type mismatch でコケる。型が合わないキーだけ
# 事前に消しておけば、後続タスクは current_value=None となり strict のまま通る。
- name: Drop existing keys that have a mismatched type
  ansible.builtin.shell: |
    set -euo pipefail
    current=$(/usr/bin/defaults read-type "{{ item.domain }}" "{{ item.key }}" 2>/dev/null | sed 's/^Type is //') || exit 0
    if [ -n "$current" ] && [ "$current" != "{{ item.type }}" ]; then
      /usr/bin/defaults delete "{{ item.domain }}" "{{ item.key }}"
      echo deleted
    fi
  register: macos_defaults_normalize
  changed_when: "'deleted' in macos_defaults_normalize.stdout"
  # type は `defaults read-type` の出力 (integer/boolean/float/string/...) と一致させる
  loop:
    - { domain: NSGlobalDomain, key: KeyRepeat, type: integer }
    - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: integer }
    - { domain: com.apple.AppleMultitouchTrackpad, key: FirstClickThreshold, type: float }
    - { domain: com.apple.AppleMultitouchTrackpad, key: SecondClickThreshold, type: float }
    - { domain: com.apple.AppleMultitouchTrackpad, key: TrackpadThreeFingerHorizSwipeGesture, type: float }
    - { domain: com.apple.dock, key: autohide, type: boolean }
    - { domain: com.apple.inputmethod.Kotoeri, key: JIMPrefPunctuationTypeKey, type: integer }
  loop_control:
    label: "{{ item.domain }} {{ item.key }} ({{ item.type }})"

- name: Set fast key repeat rate
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2

- name: Shorten initial key repeat delay
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15

- name: Soften trackpad first click threshold
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: FirstClickThreshold
    type: float
    value: 0

- name: Soften trackpad second click threshold
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: SecondClickThreshold
    type: float
    value: 0

- name: Enable three-finger horizontal swipe gesture
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadThreeFingerHorizSwipeGesture
    type: float
    value: 1

- name: Enable Dock auto-hide
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: true
  register: dock_autohide

# `defaults write` は保存値を変えるだけで、動いている Dock には届かない。
# 実測 (issue #176): autohide の保存値を 1 → 0 にしても、System Events が返す
# **生の状態は true のまま**だった。Dock を入れ直して初めて効く。
#
# **設定が実際に変わったときだけ**打つ。無条件だと毎回 changed を返し、#174 で
# 直したばかりの非冪等を再発させる (changed の数は provisioning-preflight.sh が
# 予告に使う指標でもある)。
#
# -u で自分のプロセスに絞るのは、送り先を名前だけで決めないという
# claude/signal-guard.py と同じ理由 (setup#150)。Dock が動いていない状況
# (ログイン直後など) では killall が rc=1 を返すので、そこだけ許す。
# ansible-lint は「changed のときに走るタスクは handler にすべき」と言う (no-handler)。
# ここでは採らない — handler は play 側 (playbook_sillicon_mac.yml) の handlers: に
# 置く必要があり、macOS の関心が playbook と tasks/macos.yml に割れる。
# CLAUDE.md が構成として「tasks/*.yml は 1 ファイル 1 関心」を掲げているので、
# lint の作法よりそちらを優先する (issue #179)。
- name: Restart the Dock so the new setting takes effect  # noqa: no-handler
  ansible.builtin.command:
    cmd: /usr/bin/killall -u {{ ansible_facts['env']['USER'] }} Dock
  when: dock_autohide.changed
  register: dock_restart
  changed_when: true
  failed_when:
    - dock_restart.rc != 0
    - "'No matching processes' not in (dock_restart.stderr | default(''))"

- name: Set Kotoeri punctuation to comma/period
  community.general.osx_defaults:
    domain: com.apple.inputmethod.Kotoeri
    key: JIMPrefPunctuationTypeKey
    type: int
    value: 3

# 修飾キーの入れ替え (Caps Lock → 左 Control / fn を無効)。
#
# 置き場は ByHost の .GlobalPreferences — システム設定 > キーボード > 修飾キー が書く場所。
# **`-currentHost` を落とすと別の場所へ書いて無言で効かない。**
# キー名の末尾 `0-0-0` は VendorID-ProductID で、0-0-0 は「全キーボードに共通」。
# 特定のキーボードを名指しする形もあるが、内蔵でも外付けでも同じ配列にしたいので共通側に置く。
#
# **osx_defaults では書けない** — 値が辞書の配列で、あのモジュールが扱えるのは
# scalar と文字列配列まで。
#
# **値は XML plist の文字列で渡す。** 旧形式 (`({Src=123;})`) も defaults は受け取るが、
# 裸の数字を**文字列として**書き込む (実測)。システム側は整数で持っているので、
# 文字列で書くと型が食い違ったまま黙って効かない。
#
# **3 件を 1 つの値として持つ。** この pref は辞書の配列ひとつなので、Caps Lock だけを
# 書くと配列ごと上書きして fn の 2 件が消える (issue #276)。
#
# 反映は再ログイン。`defaults` は保存値を書くだけで動いているプロセスには届かない
# (issue #176。キーリピート・トラックパッドと同じ)。hidutil なら即時に効くが再起動で
# 消えるので、正本を二重に持たない。
- name: Remap modifier keys (Caps Lock to Control, fn disabled)
  vars:
    # Src/Dst は HID の (usage page << 32 | usage)。0x700000000 (= 30064771072) は「無効」
    macos_modifier_mapping:
      - { src: 30064771129, dst: 30064771300 }      # Caps Lock 0x700000039 -> 左 Control 0x7000000E4
      - { src: 1095216660483, dst: 30064771072 }    # 内蔵 fn 0xFF00000003 -> 無効
      - { src: 280379760050179, dst: 30064771072 }  # 外付け fn 0xFF01000000003 -> 無効
  ansible.builtin.shell: |
    set -euo pipefail
    key=com.apple.keyboard.modifiermapping.0-0-0
    desired='{{ macos_modifier_mapping | to_json }}'
    # 並び順は意味を持たないので、組の集合として突き合わせる。順序で比べると、
    # システム設定を開いた拍子に並べ替えられただけで毎回 changed を返す。
    state=$({ /usr/bin/defaults -currentHost export -g - 2>/dev/null || true; } | /usr/bin/python3 -c '
    import json, plistlib, sys
    raw = sys.stdin.buffer.read()
    have = plistlib.loads(raw).get(sys.argv[1], []) if raw else []
    # key=repr は「型が違えば違う」を保ったまま必ず順序を決める。素の比較だと、
    # 旧形式で文字列として書かれた残骸に当たった瞬間に TypeError で落ちる
    pairs = lambda ms, s, d: sorted(((m.get(s), m.get(d)) for m in ms), key=repr)
    print("same" if pairs(have, "HIDKeyboardModifierMappingSrc", "HIDKeyboardModifierMappingDst")
          == pairs(json.loads(sys.argv[2]), "src", "dst") else "differ")
    ' "$key" "$desired")
    if [ "$state" = same ]; then
      exit 0
    fi
    /usr/bin/defaults -currentHost write -g "$key" '<array>{% for m in macos_modifier_mapping %}<dict><key>HIDKeyboardModifierMappingSrc</key><integer>{{ m.src }}</integer><key>HIDKeyboardModifierMappingDst</key><integer>{{ m.dst }}</integer></dict>{% endfor %}</array>'
    echo changed
  register: macos_modifier_remap
  changed_when: "'changed' in macos_modifier_remap.stdout"

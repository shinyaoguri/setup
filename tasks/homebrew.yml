---
# Homebrew formulae のインストール (モジュールが冪等性を保証)

# homebrew/cask-fonts は 2024-08 に upstream 削除済み。残っていると brew update が 404 で失敗する。
- name: Remove deprecated homebrew/cask-fonts tap
  community.general.homebrew_tap:
    name: homebrew/cask-fonts
    state: absent
  failed_when: false

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true

# 入れるのは required だけ。optional は sillicon_mac_setup.zsh の選択で入る
# (playbook は何が選ばれたかを知らない)。state: present なので、選んで入れたものを
# ここが消すことはない (issue #191)
- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_packages_required }}"
    state: present

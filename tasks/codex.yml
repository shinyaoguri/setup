---
# Codex のグローバル設定のうち、setup が持つもののリンク (issue #297)。
#
# 持つのは hooks.json だけ。~/.codex/config.toml は Codex アプリが自分で書き換える実ファイル
# (projects・desktop・MCP) なので、リンクや差し込みで管理すると奪い合いになる。Codex は各設定層で
# config.toml と並べて hooks.json も読むので、フックだけを別ファイルで持てばこれを避けられる。
#
# 中身は claude/settings.json の Stop hook と同じ `git gone-clean` の 1 行で、役目を終えた
# ローカルブランチを Codex のセッションでも片付ける (判定の中身は tasks/git.yml の gone の節)。
#
# ユーザー層のフックも、Codex 側で一度信頼しないと発火しない (`/hooks`。内容のハッシュで判定するので、
# 中身を変えたら信頼し直す)。信頼は製品の操作なので playbook では行わない。

# 張る先を playbook_dir から組むので、worktree から流すと worktree を指して切れる (#209。tasks/claude.yml と同じ)
- name: Refuse to link from a git worktree (~/.codex)
  ansible.builtin.assert:
    that: >-
      '/.claude/worktrees/' not in playbook_dir
      or (allow_worktree_source | default(false) | bool)
    fail_msg: >-
      この playbook は git worktree ({{ playbook_dir }}) から流されています。ここで張る
      symlink は worktree を指し、worktree が消えると全部切れます (setup#209)。
      変更を main へ入れてから、本体の checkout (~/.setup) で流してください。
    quiet: true

- name: Create ~/.codex directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex"
    state: directory
    mode: "0700"

- name: Check existing Codex hooks.json
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/hooks.json"
  register: codex_hooks_stat

- name: Back up existing Codex hooks.json if it is a regular file
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.codex/hooks.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.codex/hooks.json.bak-{{ ansible_facts['date_time']['date'] }}"
    remote_src: true
    mode: preserve
  when: codex_hooks_stat.stat.exists and not codex_hooks_stat.stat.islnk

- name: Create symlink for Codex hooks.json
  ansible.builtin.file:
    src: "{{ playbook_dir }}/codex/hooks.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.codex/hooks.json"
    state: link
    force: true

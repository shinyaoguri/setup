---
# Git アイデンティティと SSH 署名 (1Password agent 経由) の設定
#
# 事前に 1Password 側で以下を手動セットアップしておくこと:
#   1. 1Password アプリにサインイン
#   2. Settings → Developer → "Use the SSH agent" を有効化
#   3. Settings → Developer → "Integrate with 1Password CLI" を有効化
#   4. 署名用 SSH 鍵アイテムを vault に保存
#   5. Settings → General → "Keep 1Password in the menu bar" を有効化
#      SSH agent はアプリと一緒に止まる。常駐させておかないと、ウィンドウを閉じた時点で
#      コミット署名が Could not connect to socket で落ちるようになる
# 完了後:  ansible-playbook playbook_sillicon_mac.yml --tags git

- name: Set Git global username
  community.general.git_config:
    name: user.name
    value: "Shinya Oguri"
    scope: global

- name: Set Git global email
  community.general.git_config:
    name: user.email
    value: "ogrsny@gmail.com"
    scope: global

# 日常運用: squash merge 前提でのローカルブランチ掃除
#
# GitHub 側で squash merge すると、feature ブランチのコミット群は main 上の
# 新しい単一コミットに畳まれる。元コミットは main の祖先にならないため、
# `git branch -d` も `git branch --merged` も「未マージ」と判定して役に立たない。
# 代わりに「追跡していたリモートブランチが消えたか」(upstream:track == [gone]) を
# 役目終了の判定に使う。誤爆を避けるため、一覧を出す `git gone` と、それを削除する
# `git gone-clean` の 2 段構えにしてある。
#
#   git gone          # 掃除対象を一覧（fetch -p してから判定）
#   git gone-clean    # 一覧のブランチを削除（worktree が掴んでいるものは拒否される）
#
# 削除するのはローカルの参照だけで、内容は main に入っており、元コミットも
# GitHub 側に refs/pull/<N>/head として残るため情報は失われない。
#
# ただし [gone] 判定は **upstream を持つブランチしか拾えない**。一度も push して
# いないローカル専用ブランチ（Claude Code の worktree 分離が作る worktree-agent-*
# や、push せずに終わったセッションブランチ）は upstream が無いので永遠に対象外で、
# これが実際に数十本まで積み上がった。
#
# そこで判定をもう 1 本用意する。「既定ブランチの祖先である」= 内容が完全に
# 取り込み済みで、消しても 1 ビットも失われないローカルブランチ:
#
#   git stale         # 既定ブランチに取り込み済みのローカルブランチを一覧
#   git stale-clean   # それを削除（-d のみ。取り込み済みでなければ git が拒否する）
#
# 除外は for-each-ref に任せる: %(worktreepath) が非空 = どこかの worktree が
# 掴んでいる（現在のブランチを含む）ので候補から外れ、既定ブランチ自身も名前で
# 外す。fetch はしない — 祖先判定は単調で、origin/main が古くても誤爆せず
# 「拾い漏らす」側にしか倒れないため、オフラインでも安全に走る。

- name: Prune stale remote-tracking branches on every fetch
  community.general.git_config:
    name: fetch.prune
    value: "true"
    scope: global

- name: Add git alias `gone` (list local branches whose upstream is gone)
  community.general.git_config:
    name: alias.gone
    value: "!git fetch -pq && git for-each-ref --format='%(upstream:track) %(refname:short)' refs/heads | grep -F '[gone] ' | cut -d' ' -f2"
    scope: global

- name: Add git alias `gone-clean` (delete the branches listed by `git gone`)
  community.general.git_config:
    name: alias.gone-clean
    value: "!git gone | while read -r branch; do git branch -D \"$branch\"; done"
    scope: global

- name: Add git alias `stale` (list local branches already contained in the default branch)
  community.general.git_config:
    name: alias.stale
    value: '!base=$(git symbolic-ref -q --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/main); git for-each-ref --format="%(refname:short) %(worktreepath)" refs/heads | awk "NF==1 {print \$1}" | grep -vxF "${base#origin/}" | while read -r branch; do git merge-base --is-ancestor "$branch" "$base" 2>/dev/null && echo "$branch"; done; true'
    scope: global

- name: Add git alias `stale-clean` (delete the branches listed by `git stale`)
  community.general.git_config:
    name: alias.stale-clean
    value: '!git stale | while read -r branch; do git branch -d "$branch"; done'
    scope: global

- name: Read SSH public key from 1Password agent
  ansible.builtin.shell:
    cmd: "set -o pipefail && ssh-add -L | head -1"
    executable: /bin/zsh
  environment:
    SSH_AUTH_SOCK: "{{ ansible_facts['env']['HOME'] }}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
  register: ssh_pubkey
  failed_when: false
  changed_when: false

- name: Warn if 1Password SSH agent has no key yet
  ansible.builtin.debug:
    msg:
      - "⚠️  1Password SSH agent から鍵を取得できませんでした。"
      - "1Password の手動セットアップを完了してから再実行してください:"
      - "  1. 1Password アプリにサインイン"
      - "  2. Settings → Developer → Use the SSH agent を有効化"
      - "  3. Settings → Developer → Integrate with 1Password CLI を有効化"
      - "  4. 署名用 SSH 鍵アイテムを vault に保存"
      - "  5. Settings → General → Keep 1Password in the menu bar を有効化"
      - "完了後:  ansible-playbook playbook_sillicon_mac.yml --tags git"
  when: ssh_pubkey.rc != 0 or ssh_pubkey.stdout == ""

- name: Configure SSH commit signing
  when: ssh_pubkey.rc == 0 and ssh_pubkey.stdout != ""
  block:
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
        state: directory
        mode: '0700'

    - name: Write SSH signing public key
      ansible.builtin.copy:
        content: "{{ ssh_pubkey.stdout }}\n"
        dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/git_signing_key.pub"
        mode: '0644'

    - name: Ensure ~/.config/git exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/git"
        state: directory
        mode: '0755'

    - name: Write allowed_signers for local verification
      ansible.builtin.copy:
        content: "ogrsny@gmail.com {{ ssh_pubkey.stdout }}\n"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/allowed_signers"
        mode: '0644'

    - name: Set gpg.format to ssh
      community.general.git_config:
        name: gpg.format
        value: ssh
        scope: global

    - name: Set user.signingkey to SSH public key file
      community.general.git_config:
        name: user.signingkey
        value: "{{ ansible_facts['env']['HOME'] }}/.ssh/git_signing_key.pub"
        scope: global

    - name: Set gpg.ssh.allowedSignersFile
      community.general.git_config:
        name: gpg.ssh.allowedSignersFile
        value: "{{ ansible_facts['env']['HOME'] }}/.config/git/allowed_signers"
        scope: global

    - name: Enable commit signing
      community.general.git_config:
        name: commit.gpgsign
        value: "true"
        scope: global

    - name: Enable tag signing
      community.general.git_config:
        name: tag.gpgsign
        value: "true"
        scope: global
